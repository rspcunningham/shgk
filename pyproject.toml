[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shgk-corpus"
version = "0.1.0"
description = "Ingest, curate and translate a Russian What? Where? When? question corpus"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "openai-agents>=0.20.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
# F catches undefined names, which is how a missing import gets through when the
# tests exercise a stand-in rather than the real object.
select = ["E", "F", "I", "UP", "B"]
