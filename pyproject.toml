[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shgk-corpus"
version = "0.1.0"
description = "Local ingestion tools for Russian What? Where? When? questions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "openai-agents>=0.20.0",
    "python-dotenv>=1.2.2",
    "rich>=13,<15",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
]

[project.scripts]
shgk = "shgk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
